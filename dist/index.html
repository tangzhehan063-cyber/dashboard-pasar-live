<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lembar Pasar</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>/* Lembar Pasar — financial-newspaper page meets exchange board.
   Paper + ink, hairline rules, serif headlines, mono figures. Colour only where it means something. */
:root {
  color-scheme: light;
  --page: #f3efe6; --surface: #f3efe6; --line: #d6cfbf; --rule: #1a1712; --chip: #e8e2d4;
  --ink: #1a1712; --ink-2: #4a443a; --muted: #857c6c;
  --accent: #c2410c;               /* stempel oranye — satu aksen saja */
  --c1: #2a5db0; --c2: #c2410c; --c3: #0f7a5a; --c4: #a87700;
  --up: #0f6b3a; --up-bg: #d8e6d3; --down: #b3261e; --down-bg: #f1d6cf;
  --serif: "Fraunces", Georgia, serif; --sans: "IBM Plex Sans", system-ui, sans-serif; --monof: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) {
  color-scheme: dark; --page: #12110e; --surface: #12110e; --line: #34302a; --rule: #ece5d6; --chip: #22201b;
  --ink: #ece5d6; --ink-2: #c4bba8; --muted: #8d8576; --accent: #f08a4b;
  --c1: #7aa2e3; --c2: #f08a4b; --c3: #4fbf94; --c4: #d9a93a;
  --up: #6fd29a; --up-bg: #1d3426; --down: #ff8f84; --down-bg: #3d1f1b; } }
:root[data-theme="dark"] {
  color-scheme: dark; --page: #12110e; --surface: #12110e; --line: #34302a; --rule: #ece5d6; --chip: #22201b;
  --ink: #ece5d6; --ink-2: #c4bba8; --muted: #8d8576; --accent: #f08a4b;
  --c1: #7aa2e3; --c2: #f08a4b; --c3: #4fbf94; --c4: #d9a93a;
  --up: #6fd29a; --up-bg: #1d3426; --down: #ff8f84; --down-bg: #3d1f1b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 var(--sans); overflow-x: hidden; }
.mono { font-family: var(--monof); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 12px; } .skel { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 22px 20px 48px; }

/* masthead */
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 3px double var(--rule); }
.kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); display: flex; align-items: center; }
h1 { margin: 2px 0 0; font: 600 clamp(40px, 7vw, 68px)/0.95 var(--serif); letter-spacing: -.03em; font-variation-settings: "opsz" 144; }
.sub { color: var(--ink-2); font-size: 14px; margin-top: 6px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 8px; }
.dot.live { background: var(--accent); animation: blink 1.6s steps(2, start) infinite; }
@keyframes blink { 50% { opacity: .25; } }

/* ticker tape */
.tape { overflow: hidden; border-bottom: 1px solid var(--rule); font-size: 13px; white-space: nowrap; margin-bottom: 26px; }
.tape-in { display: inline-flex; animation: tape 40s linear infinite; padding: 8px 0; }
.tape:hover .tape-in { animation-play-state: paused; }
.tk { padding: 0 22px; border-right: 1px solid var(--line); } .tk b { font-weight: 500; margin-right: 6px; }
@keyframes tape { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .tape-in, .dot.live { animation: none; } .tape { overflow-x: auto; } }

button, input { font: inherit; color: inherit; }
.btn { background: transparent; border: 1px solid var(--rule); border-radius: 0; padding: 7px 12px; cursor: pointer; font-size: 13px; min-height: 36px; }
.btn:hover { background: var(--ink); color: var(--page); }
.btn:focus-visible, .tag:focus-visible, tr.pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.sm { padding: 3px 10px; font-size: 12px; min-height: 30px; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--page); }
.banner { border: 1px solid var(--rule); border-left: 6px solid var(--accent); padding: 12px 14px; margin-bottom: 16px; font-size: 14px; }

/* sections = newspaper columns */
.grid { display: grid; gap: 34px 40px; grid-template-columns: 1fr; }
@media (min-width: 920px) { .grid { grid-template-columns: 1.35fr 1fr; } .span2 { grid-column: 1 / -1; } }
.card { min-width: 0; border-top: 1px solid var(--rule); padding-top: 10px; }
.card h2 { margin: 0 0 8px; font: 600 22px/1.2 var(--serif); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card h2 small { font: 400 11px var(--monof); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.h2l { display: flex; align-items: baseline; gap: 10px; }
.no { font-size: 12px; color: var(--accent); font-weight: 500; }
.note { color: var(--muted); font-size: 12px; margin-top: 10px; max-width: 70ch; }
.err { font-size: 13px; background: var(--down-bg); padding: 8px 10px; margin-top: 10px; } .err b { color: var(--down); }

/* portfolio lede */
.lede { padding: 6px 0 18px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.lbl { color: var(--muted); font: 11px var(--monof); text-transform: uppercase; letter-spacing: .06em; }
.headline { margin: 4px 0 10px; font: 400 clamp(26px, 4.4vw, 46px)/1.12 var(--serif); letter-spacing: -.02em; max-width: 26ch; }
.headline .mono { font-weight: 500; letter-spacing: -.04em; }
.word.up { color: var(--up); font-style: italic; } .word.down { color: var(--down); font-style: italic; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 13px; color: var(--ink-2); } .facts b { font-weight: 500; color: var(--ink); }
.alloc { margin-bottom: 14px; }
.allocbar { display: flex; gap: 2px; height: 10px; margin: 8px 0; }
.allocbar .seg { min-width: 4px; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 9px; height: 9px; margin-right: 6px; }
.legend b { color: var(--ink); font-weight: 500; margin-left: 2px; }
.masked .secret { filter: blur(7px); user-select: none; }

/* tables */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font: 500 11px var(--monof); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 4px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { padding: 10px 4px; border-bottom: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
td:first-child { white-space: normal; }
tbody tr:last-child td { border-bottom: 0; }
th.r, td.r { text-align: right; }
tr.pick { cursor: pointer; }
tr.pick:hover td { background: var(--chip); }
tr.sel td { background: var(--chip); } tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.assetcell { display: flex; align-items: center; gap: 10px; }
.avatar { flex: none; position: relative; overflow: visible !important; display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: contain; display: block; }
.avatar.co { background: #1a1712; padding: 5px; box-shadow: 0 0 0 1.5px var(--c); }   /* stock logos are light-on-transparent */
.avatar.mono-av { background: var(--page); box-shadow: inset 0 0 0 1.5px var(--c); color: var(--c); font: 600 11px var(--monof); letter-spacing: -.02em; }
.tk-logo { width: 14px; height: 14px; vertical-align: -2px; margin-right: 6px; }
.nm .small { margin-top: 1px; }
.chip { font: 500 10px var(--monof); text-transform: uppercase; letter-spacing: .04em; color: var(--c); margin-right: 4px; }
.spark { width: 84px; height: 24px; display: block; margin-left: auto; }
.spark polyline { stroke: var(--ink); } .spark circle { fill: var(--accent); }
.delta { display: inline-flex; align-items: center; gap: 4px; font: 13px var(--monof); white-space: nowrap; padding: 1px 6px; color: var(--ink-2); }
.delta .ic { font-size: 9px; }
.delta.up { color: var(--up); background: var(--up-bg); } .delta.down { color: var(--down); background: var(--down-bg); }

/* watchlist chips */
.edit { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
.tag { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); background: transparent; padding: 4px 8px; font-size: 12px; cursor: pointer; min-height: 30px; }
.tag span { color: var(--muted); } .tag:hover { border-color: var(--down); } .tag:hover span { color: var(--down); }
.edit input { flex: 1 1 120px; min-width: 0; background: transparent; border: 0; border-bottom: 1px dashed var(--muted); padding: 5px 2px; font-size: 13px; text-transform: uppercase; }
.edit input:focus { outline: none; border-bottom: 1px solid var(--accent); }

/* chart */
.hero { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin: 4px 0 2px; }
.big { font-size: 40px; font-weight: 500; letter-spacing: -.04em; }
.chartbox { position: relative; height: 260px; margin-top: 8px; }
.chartbox svg { width: 100%; height: 100%; display: block; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--page); font-size: 12px; padding: 5px 8px; white-space: nowrap; transform: translate(-50%, -125%); }
details { margin-top: 8px; font-size: 13px; color: var(--ink-2); } summary { cursor: pointer; }
footer { margin-top: 36px; padding-top: 10px; border-top: 3px double var(--rule); color: var(--muted); font-size: 12px; }

/* responsive */
@media (max-width: 640px) { .hide-sm { display: none; } .wrap { padding: 16px 14px 40px; } .chartbox { height: 210px; } .big { font-size: 32px; } }
@media (max-width: 380px) { .hide-xs { display: none; } }
@media (max-width: 640px) { .nm .small { display: none; } }
@media (max-width: 640px) { td { font-size: 13px; padding: 9px 2px; } th { padding: 6px 2px; } .delta { padding: 1px 4px; } }

/* ---- analysis ---- */
header { margin-bottom: 26px; }
.grid { grid-template-columns: 1fr !important; }
.atitle { display: inline-flex; align-items: center; gap: 10px; }
.block { padding: 14px 0; border-top: 1px solid var(--line); }
.block h3, .blockhead h3 { margin: 0 0 8px; font: 600 17px var(--serif); }
.blockhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.two { display: grid; gap: 0 40px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .two { grid-template-columns: 1fr 1fr; } }
.picker { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 14px; }
.picker .tag { padding: 0; } .picker .tag button { background: none; border: 0; padding: 5px 8px; cursor: pointer; font: inherit; }
.picker .tag button + button { padding-left: 2px; color: var(--muted); }
.picker .tag.on { background: var(--ink); border-color: var(--ink); } .picker .tag.on button { color: var(--page); }
.add { display: flex; gap: 4px; align-items: center; }
.add select { font: 12px var(--monof); background: transparent; color: inherit; border: 1px solid var(--line); padding: 5px; min-height: 30px; }
.add input { width: 150px; background: transparent; border: 0; border-bottom: 1px dashed var(--muted); padding: 5px 2px; font-size: 13px; text-transform: uppercase; }
.add input:focus { outline: none; border-bottom-color: var(--accent); }
.sig { font: 600 13px var(--monof); text-transform: uppercase; letter-spacing: .04em; padding: 2px 8px; }
.sig.up { color: var(--up); background: var(--up-bg); } .sig.down { color: var(--down); background: var(--down-bg); } .sig.flat { color: var(--ink-2); background: var(--chip); }
.verdict { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; } .verdict .sig { font-size: 16px; padding: 4px 12px; }
.facts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px 20px; margin: 0; }
.facts-grid dt { font: 11px var(--monof); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.facts-grid dd { margin: 3px 0 0; font-size: 15px; }
.tally { display: flex; gap: 1px; height: 4px; margin-top: 6px; } .tally i { display: block; }
.tally .b { background: var(--up); } .tally .n { background: var(--line); } .tally .s { background: var(--down); }
.up-t { color: var(--up); } .down-t { color: var(--down); }
.lbl.sp { margin: 16px 0 8px; }
.bars { display: flex; gap: 10px; align-items: end; height: 130px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; }
.bar-pair { flex: 1; width: 100%; display: flex; gap: 3px; align-items: end; justify-content: center; }
.bar-pair i { width: 40%; max-width: 22px; display: block; min-height: 1px; }
.ba, .legend i.ba { background: var(--ink); } .bb, .legend i.bb { background: var(--accent); }
table.tight td { padding: 6px 4px; font-size: 13px; }
.avatar img { border-radius: 50%; }
.avatar.etf-av { background: #1a1712; color: #f3efe6; box-shadow: 0 0 0 1.5px var(--c); font: 600 10px var(--monof); letter-spacing: -.03em; }
.etf-tag { position: absolute; right: -6px; bottom: -4px; font: 700 7px/1 var(--monof); letter-spacing: .04em; background: var(--c); color: #fff; padding: 2px 3px; border: 1.5px solid var(--page); }
.avatar.etf-av { font-size: 9px; }
</style>
